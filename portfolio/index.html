<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Portfolio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f4;
      color: #1c1917;
    }
    form {
      width: min(320px, 90vw);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
    p { margin: 0; font-size: 14px; color: #57534e; }
    input, button {
      font: inherit;
      font-size: 15px;
      padding: 10px 12px;
      border-radius: 8px;
    }
    input { border: 1px solid #d6d3d1; background: #fff; }
    input:focus { outline: 2px solid #1c1917; outline-offset: -1px; }
    button { border: 0; background: #1c1917; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    #error { min-height: 20px; font-size: 14px; color: #b91c1c; }
  </style>
</head>
<body>
  <form id="gate">
    <h1>Portfolio</h1>
    <p>Enter the password to continue.</p>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
    <button type="submit">Open</button>
    <div id="error" role="alert"></div>
  </form>

  <script>
    // Generated by encrypt.mjs - the Figma URL encrypted with the password.
    const PAYLOAD = {"salt":"eeUZ+/GDQBFrwrvwXnfDRw==","iv":"I/+DrQLGAkz3i3mR","data":"g5lrIuDkr8CxfuNVFUBfvaK3YqdAS8e+uhdpzyQI3DLf4ZaU/hRYYFGhPhWvYUjv9Bx4ROVAIsGg6laqsYYe032RMvcOyIZEIbYyU4Ix4vkJMey/5rCUPXXsZfM4TDNJerpa0FIA+hN6wPzEvjX4K88EV0vA046vN/gvSxvvgtmK521IwFMVWyuxcd0p2KRoDCyhj3965LvJN1LT/UKQ4ZCS/DN5U8kxx+sIAB5jvREEqfOnFZvXW18g0FuJ87pZbXftT+MZqA5iVSl3QEpUVNuq7k5RUpfYEg=="};

    const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

    async function decrypt(password) {
      const baseKey = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: fromB64(PAYLOAD.salt), iterations: 600000, hash: "SHA-256" },
        baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromB64(PAYLOAD.iv) }, key, fromB64(PAYLOAD.data));
      return new TextDecoder().decode(plain);
    }

    const form = document.getElementById("gate");
    const input = document.getElementById("password");
    const error = document.getElementById("error");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.textContent = "";
      button.disabled = true;
      try {
        window.location.replace(await decrypt(input.value));
      } catch {
        error.textContent = "Incorrect password.";
        input.select();
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
